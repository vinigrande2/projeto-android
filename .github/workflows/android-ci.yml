name: Android CI (Kotlin)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
     steps:
    # Passo 1: Baixa o código do repositório para o Runner
    - name: Checkout do código
      uses: actions/checkout@v4

    # Passo 2: Configura o Java (necessário para projetos Kotlin/Android)
    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Passo 3: Dá permissão para rodar o script de compilação
    - name: Tornar o gradlew executável
      run: chmod +x ./gradlew

    # Passo 4: Executa o build da aplicação
    - name: Build com Gradle
      run: ./gradlew build
